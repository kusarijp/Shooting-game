<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>STAR SWEEPER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root{--bg:#070b1a;--edge:#1d2a5a;--ink:#e8f0ff;--red:#ff2b2b}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#000;color:var(--ink);font-family:'DotGothic16',ui-monospace,monospace;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
canvas{display:block;height:min(100vh,calc(100vw * 1.5));aspect-ratio:2/3;background:var(--bg);border:2px solid var(--edge);touch-action:none}
#rick{position:fixed;inset:0;z-index:9999;background:#000;display:none;cursor:none}
#rv{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000;pointer-events:none}
#tap{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:28px;cursor:pointer}
#end{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#000;text-align:center;cursor:default;padding:24px}
#end p{margin:0;font-size:clamp(22px,5vw,40px)}
#end small{opacity:.7;font-size:14px}
#end button{margin-top:10px;font:inherit;font-size:18px;padding:12px 28px;color:#000;background:#47e5ff;border:0;border-radius:6px;cursor:pointer}
@media (prefers-reduced-motion:reduce){canvas{scroll-behavior:auto}}
</style>
</head>
<body>
<canvas id="c" width="480" height="720"></canvas>

<div id="rick">
  <video id="rv" src="rickroll.mp4" preload="auto" playsinline disablepictureinpicture controlslist="nodownload noremoteplayback nofullscreen"></video>
  <div id="tap">▶ 画面をクリックして再生</div>
  <div id="end">
    <p>🎵 Rickrolled!</p>
    <p>Never gonna give you up…</p>
    <small id="endmsg">最後まで見てくれてありがとう！</small>
    <button onclick="location.reload()">もう一度あそぶ</button>
  </div>
</div>

<script>
(()=>{
const $=id=>document.getElementById(id);
const cv=$('c'),g=cv.getContext('2d'),W=480,H=720;
const FONT="'DotGothic16',monospace";
let state='title',locked=false,t=0,wt=0,bt=0,score=0,hi=0,shootCD=0,blackout=false;
const keys={};let touchX=null;
const P={x:W/2,y:H-70,w:30,h:30,sp:5};
let bullets=[],enemies=[],ebullets=[],boss=null,bossHp=1;
const stars=Array.from({length:70},()=>({x:Math.random()*W,y:Math.random()*H,s:.5+Math.random()*2}));

/* ---------- Audio ---------- */
let ac,bgmTimer=null,sirenTimer=null,step=0;
const mel=[262,0,330,0,392,330,262,0,294,0,349,0,440,349,294,0,330,0,392,0,494,392,330,0,392,0,349,0,330,294,262,0];
function beep(f,d,type='square',v=.05){
  if(!ac||!f)return;
  const o=ac.createOscillator(),n=ac.createGain(),now=ac.currentTime;
  o.type=type;o.frequency.value=f;
  n.gain.setValueAtTime(v,now);n.gain.exponentialRampToValueAtTime(.0001,now+d);
  o.connect(n);n.connect(ac.destination);o.start(now);o.stop(now+d);
}
function startBgm(){
  stopBgm();
  bgmTimer=setInterval(()=>{
    const f=mel[step%mel.length];
    beep(f,.14,'square',.035);
    if(step%4===0)beep((f||262)/2,.3,'triangle',.06);
    step++;
  },150);
}
function stopBgm(){clearInterval(bgmTimer);bgmTimer=null}
function startSiren(){
  stopSiren();let i=0;
  sirenTimer=setInterval(()=>beep(i++%2?980:620,.28,'sawtooth',.08),300);
}
function stopSiren(){clearInterval(sirenTimer);sirenTimer=null}

/* ---------- Input ---------- */
addEventListener('keydown',e=>{
  if(locked)return;
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown','Space'].includes(e.code))e.preventDefault();
  keys[e.code]=true;
  if(e.code==='Space'&&(state==='title'||state==='over'))startGame();
});
addEventListener('keyup',e=>{if(!locked)keys[e.code]=false});
function tpos(e){const r=cv.getBoundingClientRect();return(e.touches[0].clientX-r.left)/r.width*W}
cv.addEventListener('touchstart',e=>{
  if(locked)return;
  touchX=tpos(e);keys.Touch=true;
  if(state==='title'||state==='over')startGame();
},{passive:true});
cv.addEventListener('touchmove',e=>{if(!locked)touchX=tpos(e)},{passive:true});
cv.addEventListener('touchend',()=>{touchX=null;keys.Touch=false});

/* ---------- Game flow ---------- */
function startGame(){
  if(!ac){try{ac=new (window.AudioContext||window.webkitAudioContext)()}catch(_){}}
  if(ac&&ac.state==='suspended')ac.resume();
  bullets=[];enemies=[];ebullets=[];boss=null;bossHp=1;blackout=false;
  score=0;t=0;wt=0;bt=0;shootCD=0;P.x=W/2;
  state='play';startBgm();
}
function startBoss(){
  state='warn';wt=0;enemies=[];ebullets=[];
  stopBgm();startSiren();
}
function gameOver(){
  state='over';hi=Math.max(hi,score);stopBgm();
  beep(160,.5,'sawtooth',.08);
}

/* ---------- Rickroll ---------- */
const rv=$('rv');
function rickroll(){
  state='rick';locked=true;
  stopBgm();stopSiren();
  const box=$('rick');
  box.style.display='block';
  rv.muted=false;rv.volume=1;rv.currentTime=0;
  if(box.requestFullscreen){box.requestFullscreen({navigationUI:'hide'}).catch(()=>{})}
  if(navigator.keyboard&&navigator.keyboard.lock){try{navigator.keyboard.lock(['Escape']).catch(()=>{})}catch(_){}}
  const p=rv.play();
  if(p&&p.catch)p.catch(()=>{$('tap').style.display='flex'});
}
$('tap').addEventListener('click',()=>{rv.muted=false;rv.volume=1;rv.play();$('tap').style.display='none'});
rv.addEventListener('pause',()=>{if(locked&&!rv.ended)rv.play().catch(()=>{})});
rv.addEventListener('ended',()=>endRick());
rv.addEventListener('error',()=>endRick('動画ファイル（rickroll.mp4）が見つかりませんでした…'));
function endRick(msg){
  locked=false;
  if(navigator.keyboard&&navigator.keyboard.unlock)navigator.keyboard.unlock();
  if(document.fullscreenElement)document.exitFullscreen().catch(()=>{});
  if(msg)$('endmsg').textContent=msg;
  rv.style.display='none';$('tap').style.display='none';
  $('end').style.display='flex';
}
/* Lock all input while the video plays */
['keydown','keyup','keypress','click','dblclick','mousedown','mouseup','contextmenu','wheel','touchstart','touchmove','touchend','pointerdown'].forEach(n=>{
  addEventListener(n,e=>{
    if(!locked)return;
    if(e.target&&e.target.id==='tap')return;
    e.preventDefault();e.stopImmediatePropagation();
  },{capture:true,passive:false});
});

/* ---------- Update ---------- */
const hit=(a,b)=>Math.abs(a.x-b.x)<(a.w+b.w)/2&&Math.abs(a.y-b.y)<(a.h+b.h)/2;
function update(){
  stars.forEach(s=>{s.y+=s.s*(state==='boss'?1:1.2);if(s.y>H){s.y=0;s.x=Math.random()*W}});
  if(state==='title'||state==='over'||state==='rick'||state==='black')return;
  t++;

  /* player */
  let dx=0;
  if(keys.ArrowLeft)dx-=P.sp;
  if(keys.ArrowRight)dx+=P.sp;
  if(touchX!==null){dx=Math.max(-P.sp*1.6,Math.min(P.sp*1.6,touchX-P.x))}
  P.x=Math.max(20,Math.min(W-20,P.x+dx));
  if(shootCD>0)shootCD--;
  if((keys.Space||keys.Touch)&&shootCD===0){
    bullets.push({x:P.x,y:P.y-20,w:5,h:14});
    shootCD=9;beep(900,.05,'square',.02);
  }
  bullets.forEach(b=>b.y-=11);
  bullets=bullets.filter(b=>b.y>-20);

  if(state==='play'){
    if(t%Math.max(34,62-Math.floor(score/40))===0){
      enemies.push({x:30+Math.random()*(W-60),y:-20,w:30,h:30,vy:1.3+Math.random()*1.2,vx:(Math.random()-.5)*1.2,shooter:score>=150&&Math.random()<.3,cd:70});
    }
    enemies.forEach(e=>{
      e.y+=e.vy;e.x+=e.vx;
      if(e.x<20||e.x>W-20)e.vx*=-1;
      if(e.shooter&&--e.cd<=0&&e.y>0&&e.y<H-250){
        ebullets.push({x:e.x,y:e.y+14,w:8,h:8});e.cd=120;
      }
    });
    ebullets.forEach(b=>b.y+=3);
    /* bullet vs enemy */
    for(const b of bullets){
      for(const e of enemies){
        if(!e.dead&&!b.dead&&hit(b,e)){e.dead=b.dead=true;score+=e.shooter?30:10;beep(140,.12,'sawtooth',.05)}
      }
    }
    enemies=enemies.filter(e=>!e.dead&&e.y<H+30);
    bullets=bullets.filter(b=>!b.dead);
    ebullets=ebullets.filter(b=>b.y<H+10);
    if(enemies.some(e=>hit(e,P))||ebullets.some(b=>hit(b,{x:P.x,y:P.y,w:14,h:14})))return gameOver();
    if(score>=500||t>=2400)startBoss();
  }
  else if(state==='warn'){
    if(++wt>=180){state='boss';bt=0;boss={x:W/2,y:-90};stopSiren()}
  }
  else if(state==='boss'){
    bt++;
    boss.y+=(130-boss.y)*.05;
    boss.x=W/2+Math.sin(bt/25)*90;
    for(const b of bullets){
      if(!b.dead&&Math.abs(b.x-boss.x)<60&&Math.abs(b.y-boss.y)<55){b.dead=true;bossHp=Math.max(.72,bossHp-.012)}
    }
    bullets=bullets.filter(b=>!b.dead);
    if(bt>=110){
      state='black';blackout=true;
      setTimeout(rickroll,350);
    }
  }
}

/* ---------- Draw ---------- */
function text(s,x,y,size,color,align='center'){
  g.font=`${size}px ${FONT}`;g.textAlign=align;g.fillStyle=color;g.fillText(s,x,y);
}
function draw(){
  g.clearRect(0,0,W,H);
  g.fillStyle='#070b1a';g.fillRect(0,0,W,H);
  stars.forEach(s=>{g.fillStyle=`rgba(180,210,255,${.25+s.s*.2})`;g.fillRect(s.x,s.y,s.s,s.s*2)});

  if(state==='title'){
    text('STAR SWEEPER',W/2,250,52,'#47e5ff');
    text('STAGE 1-1',W/2,305,22,'#ffe45e');
    text('← → で移動 ／ SPACE で発射',W/2,420,18,'#e8f0ff');
    if(Math.floor(Date.now()/500)%2)text('PRESS SPACE TO START',W/2,500,22,'#ffffff');
    if(hi)text('HI '+String(hi).padStart(6,'0'),W/2,560,16,'#8fa3d6');
    return;
  }

  /* player */
  if(state!=='over'){
    g.fillStyle='#47e5ff';
    g.beginPath();g.moveTo(P.x,P.y-18);g.lineTo(P.x+16,P.y+14);g.lineTo(P.x,P.y+6);g.lineTo(P.x-16,P.y+14);g.closePath();g.fill();
    g.fillStyle='#ffe45e';g.fillRect(P.x-2,P.y+8,4,6+Math.random()*5);
  }
  g.fillStyle='#ffe45e';bullets.forEach(b=>g.fillRect(b.x-b.w/2,b.y-b.h/2,b.w,b.h));
  g.font=`28px ${FONT}`;g.textAlign='center';g.textBaseline='middle';
  enemies.forEach(e=>g.fillText(e.shooter?'👾':'🟥',e.x,e.y));
  g.textBaseline='alphabetic';
  g.fillStyle='#ff4fa3';ebullets.forEach(b=>{g.beginPath();g.arc(b.x,b.y,5,0,7);g.fill()});

  /* boss */
  if(boss&&(state==='boss'||state==='black')){
    g.font=`110px ${FONT}`;g.textAlign='center';g.textBaseline='middle';
    g.fillText('👹',boss.x,boss.y);g.textBaseline='alphabetic';
    g.fillStyle='#3a1020';g.fillRect(80,60,320,10);
    g.fillStyle='#ff2b2b';g.fillRect(80,60,320*bossHp,10);
    text('BOSS',80,52,14,'#ff8a8a','left');
  }

  /* HUD */
  text('SCORE '+String(score).padStart(6,'0'),14,30,18,'#e8f0ff','left');
  text('STAGE 1-1',W-14,30,18,'#ffe45e','right');
  if(state==='play'&&t<120)text('STAGE 1-1  START!',W/2,200,30,`rgba(255,255,255,${1-t/120})`);

  /* warning */
  if(state==='warn'){
    const on=Math.floor(wt/10)%2===0;
    g.fillStyle=on?'rgba(255,0,0,.28)':'rgba(255,0,0,.08)';g.fillRect(0,0,W,H);
    g.fillStyle='#ff2b2b';
    g.fillRect(0,250,W,6);g.fillRect(0,470,W,6);
    const sx=(Math.random()-.5)*6,sy=(Math.random()-.5)*6;
    g.save();g.shadowColor='#ff0000';g.shadowBlur=24;
    text('WARNING!!',W/2+sx,340+sy,68,on?'#ff2b2b':'#ff8a8a');
    text('BOSS BATTLE',W/2+sx,420+sy,52,on?'#ff2b2b':'#ff8a8a');
    g.restore();
  }

  if(state==='over'){
    text('GAME OVER',W/2,320,52,'#ff4fa3');
    text('SCORE '+score,W/2,370,22,'#e8f0ff');
    if(Math.floor(Date.now()/500)%2)text('PRESS SPACE TO RETRY',W/2,440,20,'#ffffff');
  }
  if(blackout){g.fillStyle='#000';g.fillRect(0,0,W,H)}
}

/* ---------- Loop ---------- */
let last=0,acc=0;
function frame(ts){
  acc+=Math.min(ts-last,100);last=ts;
  while(acc>=16.667){update();acc-=16.667}
  draw();requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
